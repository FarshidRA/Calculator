<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <title>🧮 Calculator</title>
  <style>
  @import url('https://fonts.cdnfonts.com/css/led-dot-matrix');                
    body {
      direction: rtl;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f3f3f3;
    }
	.mytitle{
		font-family: 'LED Dot-Matrix', sans-serif;
		color: red;
		text-align: left;
		padding:0 0 0 5px;
		margin:0px;
	}
    .calculator {
		  background: #000;
		  padding: 20px;
		  border-radius: 20px;
		  box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #display {
	background: #f3f3f3;
      width: 238px;
      height: 60px;
      margin-bottom: 10px;
      font-size: 30px;
      text-align: right;
      margin: 5px;
	  font-family: 'LED Dot-Matrix', sans-serif;
	  padding:0px;
                                                
    }
    .buttons button {
      width: 50px;
      height: 50px;
      margin: 5px;
      font-size: 18px;
    }
  </style>
</head>
<body>
<div class="calculator">
<p class="mytitle">Dot Matrix LCD</p>
  <input type="text" id="display" readonly>
  <div class="buttons">
    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button onclick="append('/')">÷</button><br>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button onclick="append('*')">×</button><br>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button onclick="append('-')">−</button><br>

    <button onclick="append('.')">.</button>
    <button onclick="append('0')">0</button>
    <button onclick="calculate()">=</button>
    <button onclick="append('+')">+</button><br>

    <button onclick="clearDisplay()" style="width: 242px;">C</button>
  </div>
</div>
<audio id="click-sound" src="https://cdn.pixabay.com/audio/2025/04/15/audio_f7d87295a5.mp3" preload="auto"></audio>

<script>
  //
	function append(char) {
	  document.getElementById('display').value += char;
	  const click = document.getElementById('click-sound');
	  click.currentTime = 0;  // 
	  click.play();
	}

	// 
	function calculate() {
	  try {
		document.getElementById('display').value = eval(document.getElementById('display').value);
	  } catch {
		document.getElementById('display').value = 'ERROR';
	  }
	  const click = document.getElementById('click-sound');
	  click.currentTime = 0;
	  click.play();  // 
	}

	//
	function clearDisplay() {
	  document.getElementById('display').value = '';
	  const click = document.getElementById('click-sound');
	  click.currentTime = 0;
	  click.play();  // 
	}

  
</script>

</body>
</html>
